<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編輯文章 - D.C. Blog</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      height: 60vh;
    }
    
    .editor-panel {
      display: flex;
      flex-direction: column;
    }
    
    .editor-panel h3 {
      margin-bottom: 12px;
      font-size: 16px;
      color: #5f6368;
    }
    
    #markdown-editor {
      flex: 1;
      width: 100%;
      padding: 16px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 15px;
      font-family: 'Consolas', 'Monaco', monospace;
      resize: none;
      line-height: 1.6;
    }
    
    #markdown-preview {
      flex: 1;
      padding: 16px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: #f8f9fa;
      overflow-y: auto;
      line-height: 1.8;
    }
    
    #markdown-preview h1, #markdown-preview h2, #markdown-preview h3 {
      margin-top: 24px;
      margin-bottom: 16px;
    }
    
    #markdown-preview p {
      margin-bottom: 16px;
    }
    
    #markdown-preview code {
      background: #e8eaed;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 14px;
    }
    
    #markdown-preview pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 4px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    
    #markdown-preview pre code {
      background: transparent;
      padding: 0;
    }
    
    #markdown-preview ul, #markdown-preview ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }
    
    #markdown-preview blockquote {
      border-left: 4px solid #1a73e8;
      margin: 16px 0;
      padding-left: 16px;
      color: #5f6368;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="dashboard.html" class="logo">管理後台</a>
      <nav class="nav">
        <a href="dashboard.html">儀表板</a>
        <a href="posts.html">文章管理</a>
        <a href="../index.html">返回前台</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div class="dashboard-header" style="margin-bottom: 24px;">
        <h1>編輯文章</h1>
        <button id="back-btn" class="btn btn-secondary" style="width: auto;">返回</button>
      </div>

      <div id="loading" class="loading">
        載入文章中...
      </div>

      <form id="post-form" class="edit-form" style="max-width: none; display: none;">
        <div class="form-row" style="margin-bottom: 24px;">
          <div class="form-group">
            <label for="title">文章標題</label>
            <input type="text" id="title" name="title" required>
          </div>
          
          <div class="form-group">
            <label for="slug">Slug (網址)</label>
            <input type="text" id="slug" name="slug" disabled style="background: #f1f3f4;">
          </div>
        </div>

        <div class="form-row" style="margin-bottom: 24px;">
          <div class="form-group">
            <label for="author">作者</label>
            <input type="text" id="author" name="author">
          </div>
          
          <div class="form-group">
            <label for="excerpt">摘要</label>
            <input type="text" id="excerpt" name="excerpt">
          </div>
        </div>

        <div class="editor-container">
          <div class="editor-panel">
            <h3>📝 Markdown 編輯</h3>
            <textarea id="markdown-editor"></textarea>
          </div>
          
          <div class="editor-panel">
            <h3>👁️ 即時預覽</h3>
            <div id="markdown-preview"></div>
          </div>
        </div>

        <div class="form-actions" style="margin-top: 24px;">
          <button type="button" id="save-btn" class="btn">💾 儲存</button>
          <button type="button" id="publish-btn" class="btn" style="background: #1e8e3e;">🚀 發佈/更新到 GitHub</button>
          <a href="../post.html" target="_blank" id="preview-link" class="btn" style="width: auto; padding: 12px 24px; text-decoration: none; display: inline-flex; align-items: center;">👁️ 預覽</a>
          <a href="posts.html">返回</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 D.C. Blog. All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/github.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    if (!isLoggedIn()) {
      window.location.href = 'login.html';
    }

    // 獲取 slug 參數
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    if (!slug) {
      alert('請指定文章 Slug');
      window.location.href = 'posts.html';
    }

    // Markdown 預覽
    const editor = document.getElementById('markdown-editor');
    const preview = document.getElementById('markdown-preview');

    editor.addEventListener('input', () => {
      preview.innerHTML = marked.parse(editor.value);
    });

    // 載入文章
    let currentPost = null;

    async function loadPost() {
      try {
        const db = getDB();
        const post = db.posts.find(p => p.slug === slug);
        
        if (!post) {
          // 嘗試從 GitHub 獲取
          const remotePost = await fetchPostFromGithub(slug);
          if (remotePost) {
            currentPost = remotePost;
          } else {
            document.getElementById('loading').innerHTML = '文章不存在';
            return;
          }
        } else {
          currentPost = post;
        }

        // 填充表單
        document.getElementById('title').value = currentPost.frontmatter?.title || currentPost.title || '';
        document.getElementById('slug').value = currentPost.slug;
        document.getElementById('author').value = currentPost.frontmatter?.author || currentPost.author || 'Admin';
        document.getElementById('excerpt').value = currentPost.frontmatter?.excerpt || currentPost.excerpt || '';
        editor.value = currentPost.content || '';
        
        // 觸發預覽更新
        preview.innerHTML = marked.parse(editor.value);

        document.getElementById('loading').style.display = 'none';
        document.getElementById('post-form').style.display = 'block';
        
        // 設置預覽連結
        document.getElementById('preview-link').href = `../post.html?slug=${slug}`;
      } catch (error) {
        document.getElementById('loading').innerHTML = '載入失敗：' + error.message;
      }
    }

    // 儲存
    document.getElementById('save-btn').addEventListener('click', async () => {
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const excerpt = document.getElementById('excerpt').value;
      const content = editor.value;

      try {
        await savePostToLocal(slug, content, {
          title,
          author,
          excerpt,
          date: new Date().toISOString()
        });

        alert('已儲存到本地！');
      } catch (error) {
        alert('儲存失敗：' + error.message);
      }
    });

    // 發佈/更新
    document.getElementById('publish-btn').addEventListener('click', async () => {
      const title = document.getElementById('title').value;
      const author = document.getElementById('author').value;
      const excerpt = document.getElementById('excerpt').value;
      const content = editor.value;

      const token = getGithubToken();
      if (!token) {
        alert('請先設置 GitHub Token 才能發佈文章');
        return;
      }

      if (!confirm('確定要發佈/更新這篇文章到 GitHub 嗎？')) {
        return;
      }

      const publishBtn = document.getElementById('publish-btn');
      const originalText = publishBtn.textContent;
      publishBtn.disabled = true;
      publishBtn.textContent = '處理中...';

      try {
        await publishPostToGithub(slug, content, {
          title,
          author,
          excerpt,
          date: new Date().toISOString()
        });

        alert('文章已成功發佈/更新到 GitHub！');
        window.location.href = 'posts.html';
      } catch (error) {
        alert('操作失敗：' + error.message);
        publishBtn.disabled = false;
        publishBtn.textContent = originalText;
      }
    });

    // 返回
    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = 'posts.html';
    });

    // 初始化
    loadPost();
  </script>
</body>
</html>
