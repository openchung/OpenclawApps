<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>後台登入 - D.C 手札</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="../index.html" class="logo">D.C 手札</a>
      <nav class="nav">
        <a href="../index.html">首頁</a>
        <a href="../about.html">關於我</a>
        <a href="https://www.linkedin.com/in/chiang-danniel-85498971/" target="_blank" class="linkedin-link" title="LinkedIn">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="login-container">
      <div class="login-box">
        <h1>🎨 管理後台</h1>
        <p class="subtitle">請登入以繼續</p>
        
        <div id="error-message" class="error-message" style="display: none;"></div>
        
        <form id="login-form">
          <div class="form-group">
            <label for="username">帳號</label>
            <input type="text" id="username" name="username" required autocomplete="username">
          </div>
          
          <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>
          
          <button type="submit" class="btn" id="submit-btn">登入</button>
        </form>
        
        <div style="text-align: center; margin-top: 24px;">
          <a href="../index.html" style="color: #5f6368; text-decoration: none; font-size: 14px;">← 返回首頁</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 D.C 手札。All rights reserved.</p>
    </div>
  </footer>

  <script src="../js/app.js"></script>
  <script>
    if (isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');
      const errorMsg = document.getElementById('error-message');
      
      submitBtn.disabled = true;
      submitBtn.textContent = '登入中...';
      errorMsg.style.display = 'none';
      
      setTimeout(() => {
        if (login(username, password)) {
          setLoggedIn('true');
          window.location.href = 'dashboard.html';
        } else {
          errorMsg.textContent = '帳號或密碼錯誤';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = '登入';
        }
      }, 500);
    });
  </script>
</body>
</html>
